
name: Build Athvan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Prepare icon source filenames
        run: |
          cp assets/athvan-icon-only-1.png assets/icon-only.png
          cp assets/athvan-icon-foreground-1.png assets/icon-foreground.png
          cp assets/athvan-icon-background.png assets/icon-background.png
          
      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android
        
      - name: Add custom alarm sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp athvan_alarm.wav android/app/src/main/res/raw/athvan_alarm.wav

      - name: Enable scheduled exact alarms
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in manifest:
              manifest = manifest.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )
              path.write_text(manifest)
          PY

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/athvan-release.p12
          chmod 600 android/app/athvan-release.p12
          keytool -list \
            -keystore android/app/athvan-release.p12 \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

      - name: Configure signed release build
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          pattern = re.compile(
              r'(?m)^([ \t]*)buildTypes[ \t]*\{[ \t]*\r?\n(?:[ \t]*\r?\n)*([ \t]*)release[ \t]*\{'
          )
          match = pattern.search(text)

          if not match:
              raise SystemExit("Could not find the release buildTypes block.")

          indent, release_indent = match.groups()

          replacement = (
              f'{indent}signingConfigs {{\n'
              f'{indent}    release {{\n'
              f'{indent}        storeFile file("athvan-release.p12")\n'
              f'{indent}        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              f'{indent}        keyAlias "athvan"\n'
              f'{indent}        keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              f'{indent}        storeType "PKCS12"\n'
              f'{indent}    }}\n'
              f'{indent}}}\n\n'
              f'{indent}buildTypes {{\n'
              f'{release_indent}release {{\n'
              f'{release_indent}    signingConfig signingConfigs.release'
          )

          text = text[:match.start()] + replacement + text[match.end():]

          run_number = os.environ["GITHUB_RUN_NUMBER"]

          text, count = re.subn(
              r'(?m)^([ \t]*)versionCode[ \t]+1[ \t]*$',
              lambda m: f'{m.group(1)}versionCode {run_number}',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not update Android versionCode.")

          text, count = re.subn(
              r'(?m)^([ \t]*)versionName[ \t]+"1\.0"[ \t]*$',
              lambda m: f'{m.group(1)}versionName "1.0.{run_number}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not update Android versionName.")

          path.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: athvan-alarm-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
