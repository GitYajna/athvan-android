name: Build Athvan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Enable scheduled exact alarms
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in manifest:
              manifest = manifest.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )
              path.write_text(manifest)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athvan-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
